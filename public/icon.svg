    <rect x="-2" y="-22" width="4" height="17" rx="2" transform="rotate(180)"/>
    <rect x="-2" y="-22" width="4" height="17" rx="2" transform="rotate(225)"/>
    <rect x="-2" y="-22" width="4" height="17" rx="2" transform="rotate(270)"/>
    <rect x="-2" y="-22" width="4" height="17" rx="2" transform="rotate(315)"/>
